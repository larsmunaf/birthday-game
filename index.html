<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="labels" class="hidden"></div>

    <div id="hud" class="hidden">
      <div id="hearts"></div>
      <div id="prompt"></div>
      <div id="toast"></div>
    </div>

    <div id="intro" class="overlay">
      <div class="card">
        <h1 id="title">Alles Gute!</h1>
        <p>
          Löse Rätsel, um <span class="heart">♥</span> zu sammeln. Sammle alle <span class="heart">♥</span>, um dein Geschenk zu
          öffnen!
        </p>
        <p class="keys">
          WASD / Pfeile: laufen · Maus: umsehen · Leertaste: springen · Shift:
          rennen · E: reden
        </p>
        <button id="start">Los geht's!</button>
      </div>
    </div>

    <div id="dialog" class="overlay hidden">
      <div class="card dialog-card">
        <div id="dialog-name"></div>
        <p id="dialog-text"></p>
        <h2 id="dialog-question"></h2>
        <div id="dialog-answers"></div>
        <p id="dialog-feedback"></p>
        <button id="dialog-close" class="small">Später (Esc)</button>
      </div>
    </div>

    <div id="win" class="overlay hidden">
      <div class="card">
        <h1 id="win-title"></h1>
        <div id="win-text"></div>
        <button id="restart">Nochmal spielen</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
